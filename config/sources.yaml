# Phase 5 — search-engine providers. Used for discovery (job pages, career
# pages); a search result is only a lead until its page is fetched and parsed.
# `implemented` reflects real code; `credential_env` names the environment
# variable the key must come from (never stored in this repository).
search_providers:
  - name: Brave Search API
    type: search_engine
    url: https://api.search.brave.com/res/v1/web/search
    access_method: API_KEY
    implemented: true            # scripts/web/brave_search.py
    credential_env: BRAVE_SEARCH_API_KEY
    api_available: true
    requires_login: false
    requires_browser: false
    capabilities:
      keyword_filter: true
      location_filter: false     # location is part of the query text only
      employment_type: false
      pagination: false
      date_filter: false
      structured_data: true
    enabled: true
  - name: SerpAPI
    type: search_engine
    url: https://serpapi.com/search.json
    access_method: API_KEY
    implemented: false
    credential_env: SERPAPI_API_KEY
    enabled: false
  - name: Bing Web Search API
    type: search_engine
    url: https://api.bing.microsoft.com/v7.0/search
    access_method: API_KEY
    implemented: false
    credential_env: BING_SEARCH_API_KEY
    enabled: false
  - name: Tavily
    type: search_engine
    url: https://api.tavily.com/search
    access_method: API_KEY
    implemented: false
    credential_env: TAVILY_API_KEY
    enabled: false
