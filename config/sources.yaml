# Source registry — V1.2. Every source declares the fields below so the
# pipeline (scripts/daily_research.py) and its adapters (scripts/sources/)
# never assume access they don't have.
#
# access_method (ground truth for what an adapter may do):
#   API            - documented API or public JSON feed; scripts/sources/<name>.py
#                    makes real HTTP calls (see Remote OK / Remotive).
#   PUBLIC_WEB     - has a public search UI but no API; only a raw-HTML fetch
#                    (scripts/sources/generic_search.py) is implemented —
#                    parsing results requires a future HTML parser or browser
#                    session (see README "How to add a new source").
#   BROWSER_REQUIRED - login-gated and/or anti-bot protected. Never scraped;
#                    requires a human-controlled logged-in browser session,
#                    results come in via scripts/sources/manual_import.py.
#   MANUAL         - no board at all; purely human research fed in as JSON.
#
# `enabled: false` means the pipeline skips this source entirely (e.g. a
# board evaluated and found not worth polling) without deleting its record.

job_boards:
  - name: Remote OK
    type: job_board
    url: https://remoteok.com/api
    access_method: API
    api_available: true
    requires_login: false
    requires_browser: false
    supported_search_types: [direct_title, remote]
    rate_limit_notes: "No documented hard limit; adapter uses timeout=10s, 2 retries with backoff."
    country_coverage: worldwide_remote
    job_types: [Full-time, Contract, Remote]
    reliability: high
    enabled: true
    # Phase 5 capability model — what the adapter (scripts/sources/remoteok.py) actually does.
    # No server-side filters: the whole feed is fetched once, then normalized,
    # mode-classified and filtered locally (QUERY BROADLY -> NORMALIZE -> CLASSIFY -> FILTER).
    capabilities:
      keyword_filter: false
      employment_type: false
      remote_filter: false   # every listing is remote by nature of the board
      location_filter: false
      pagination: false
      date_filter: false
      structured_data: true

  - name: Remotive
    type: job_board
    url: https://remotive.com/api/remote-jobs
    access_method: API
    api_available: true
    requires_login: false
    requires_browser: false
    supported_search_types: [direct_title, remote, keyword]
    rate_limit_notes: "Public API; adapter queries one request per search term, 2 retries with backoff."
    country_coverage: worldwide_remote
    job_types: [Full-time, Contract, Freelance, Remote]
    reliability: high
    enabled: true
    # Phase 5 capability model — scripts/sources/remotive.py sends ?search=<term> only.
    capabilities:
      keyword_filter: true
      employment_type: false  # job_type is read from each listing, never requested as a filter
      remote_filter: false    # remote-only board
      location_filter: false
      pagination: false
      date_filter: false
      structured_data: true

  - name: LinkedIn Jobs
    type: job_board
    url: https://www.linkedin.com/jobs/
    access_method: BROWSER_REQUIRED
    api_available: false
    requires_login: true
    requires_browser: true
    supported_search_types: [direct_title, combination, company_discovery]
    rate_limit_notes: "Anti-scraping ToS. Never automate — human-in-the-loop only."
    country_coverage: global
    job_types: [Full-time, Part-time, Contract, Remote, Hybrid, On-site]
    reliability: n/a
    enabled: false

  - name: Indeed
    type: job_board
    url: https://www.indeed.com/
    access_method: PUBLIC_WEB
    api_available: false
    requires_login: false
    requires_browser: false
    supported_search_types: [direct_title, combination]
    rate_limit_notes: "No public API; generic_search.py fetches raw HTML only, no parser wired up yet."
    country_coverage: global
    job_types: [Full-time, Part-time, Contract, Remote, Hybrid, On-site]
    reliability: medium
    enabled: true

