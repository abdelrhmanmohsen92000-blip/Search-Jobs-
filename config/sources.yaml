# Source registry. Every source is tagged with an access_type so the engine
# (and whoever runs a research cycle) never assumes it has programmatic
# access it doesn't have.
#
# access_type values:
#   api_source               - a documented/official API exists and could be
#                               integrated (credentials/implementation still
#                               required; none are wired up in V1.1).
#   searchable_source        - has a public search UI that can be queried by
#                               a browser-driving agent/session with web
#                               access, no official API assumed.
#   requires_manual_or_browser_access - effectively gated (login walls,
#                               anti-bot, ToS restrictions on scraping) and
#                               should be worked by a human or a manual
#                               browser session, not an automated scraper.

job_boards:
  - name: LinkedIn Jobs
    url: https://www.linkedin.com/jobs/
    access_type: requires_manual_or_browser_access
    notes: Login-gated, anti-scraping ToS. Browse/apply manually or via human-in-the-loop browser session.
  - name: Indeed
    url: https://www.indeed.com/
    access_type: searchable_source
  - name: Bayt
    url: https://www.bayt.com/
    access_type: searchable_source
  - name: GulfTalent
    url: https://www.gulftalent.com/
    access_type: searchable_source
  - name: Naukrigulf
    url: https://www.naukrigulf.com/
    access_type: searchable_source
  - name: Glassdoor
    url: https://www.glassdoor.com/
    access_type: requires_manual_or_browser_access
    notes: Partial content gated behind login/signup prompts.
  - name: Wellfound (AngelList Talent)
    url: https://wellfound.com/
    access_type: searchable_source
  - name: ArchDaily Jobs
    url: https://www.archdaily.com/jobs
    access_type: searchable_source
  - name: We Work Remotely
    url: https://weworkremotely.com/
    access_type: searchable_source
  - name: Remote OK
    url: https://remoteok.com/
    access_type: api_source
    notes: Publishes a public JSON feed.
  - name: Remotive
    url: https://remotive.com/
    access_type: api_source
    notes: Has a documented public API.

