# Target-company registry (Phase 5) — read by scripts/sources/company_careers.py.
#
# REAL entries, not examples. Every career_url below was found through a web
# search restricted to the company's OWN domain on 2026-10-07; none was
# typed from memory or composed to "look plausible".
#
# url_verification.status:
#   SEARCH_INDEXED  URL appears in a search index under the company's own
#                   domain. NOT fetched by this system: this sandbox's network
#                   policy refuses outbound connections to these hosts, so no
#                   entry here is LIVE_VERIFIED yet. The first successful fetch
#                   is recorded in tracking/company_career_pages.csv (last_status).
#   UNVERIFIED      no official careers URL could be confirmed -> career_url is
#                   UNKNOWN, the entry is disabled, and the browser queue gets a
#                   VERIFY_COMPANY_CAREER_URL task for a human. Never guessed.
#
# regions use config/search_matrix.yaml target_locations region keys.
# priority (HIGH/MEDIUM/LOW) is a human judgement of fit; HIGH is checked first.

companies:
