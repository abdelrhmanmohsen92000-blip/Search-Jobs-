  Transportation allowance: [transportation allowance, transport allowance, company car]
  Medical insurance: [medical insurance, health insurance]
  Annual flight ticket: [annual ticket, annual flight, air ticket, flight ticket]
  Visa sponsorship: [visa sponsorship provided, visa provided, we sponsor visas, visa sponsorship available]
  Relocation support: [relocation package, relocation support, relocation assistance]
  Performance bonus: [performance bonus, annual bonus]
  End of service benefits: [end of service, gratuity]

# Phrases that state an eligibility barrier for this candidate (based in Egypt,
# Egyptian national, profile.md). Matched on the posting text; reported as a
# risk, never used to invent a requirement.
eligibility_barriers:
  - pattern: "right to work in the (uk|united kingdom|us|usa|united states|eu|european union)"
    label: "Requires existing right to work in that country"
  - pattern: "no visa sponsorship|not able to sponsor|unable to sponsor|cannot sponsor|no sponsorship"
    label: "No visa sponsorship"
  - pattern: "(saudi|qatari|emirati|uae|kuwaiti|omani|bahraini) nationals? only|nationals only"
    label: "Restricted to nationals"
  - pattern: "arb registration|arb-registered|arb registered"
    label: "Requires UK ARB registration"
  - pattern: "security clearance"
    label: "Requires security clearance"
